  <!-- 動態生成 PWA Manifest 與桌面圖示 -->
  <script>
    (function setupPWA() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff8577"/>
            <stop offset="100%" stop-color="#ff5e7e"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="115" fill="url(#g)"/>
        <rect x="64" y="88" width="384" height="336" rx="44" fill="#fffaf7"/>
        <path d="M256 332s-88-54-88-114c0-32 25-56 54-56 18 0 34 9 34 24 0-15 16-24 34-24 29 0 54 24 54 56 0 60-88 114-88 114z" fill="#ff6b6b"/>
      </svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon))); 

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon); 

      const manifest = {
        name: '我們的小白板 - 兩人專屬空間',
        short_name: '我們的小白板',
        start_url: '.',
        display: 'standalone',
        background_color: '#fff9f5',
        theme_color: '#fff9f5',
        icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();
  </script>
