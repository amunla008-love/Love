<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="我們的小白板" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#fff9f5" />
  <title>我們的小白板 💕 兩人專屬互動空間</title>

  <script>
    (function setupPWA() {
      try {
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff8577"/>
              <stop offset="100%" stop-color="#ff5e7e"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="115" fill="url(#g)"/>
          <rect x="64" y="88" width="384" height="336" rx="44" fill="#fffaf7"/>
          <path d="M256 332s-88-54-88-114c0-32 25-56 54-56 18 0 34 9 34 24 0-15 16-24 34-24 29 0 54 24 54 56 0 60-88 114-88 114z" fill="#ff6b6b"/>
        </svg>`;
        const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon)));

        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        const manifest = {
          name: '我們的小白板 - 兩人專屬空間',
          short_name: '我們的小白板',
          start_url: '.',
          display: 'standalone',
          background_color: '#fff9f5',
          theme_color: '#fff9f5',
          icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #fff9f5;
      --coral-primary: #ff6b6b;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-cream);
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #2d2624;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #fff9f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    #lock-screen.hidden-lock {
      display: none !important;
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 260px;
    }
    .pin-btn, #pin-backspace {
      height: 52px;
      border-radius: 16px;
      background-color: #ffffff;
      border: 1px solid #ffe4e6;
      font-size: 20px;
      font-weight: 700;
      color: #44403c;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(255, 107, 107, 0.08);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .pin-btn:active, #pin-backspace:active {
      background-color: #fff1f2;
      transform: scale(0.95);
    }
    #board-canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .sticky-card {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
    }
    .sticky-card.dragging {
      z-index: 40;
      transform: scale(1.04) rotate(1deg);
      box-shadow: 0 18px 30px -8px rgba(0, 0, 0, 0.18);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .live-dot {
      animation: pulse-dot 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

  <!-- ==================== 隱私密碼鎖遮罩 ==================== -->
  <div id="lock-screen">
    <div style="width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,#ff8577,#ff5e7e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px;box-shadow:0 8px 16px rgba(255,94,126,0.25);">
      ❤️
    </div>
    <h1 style="font-size:22px;font-weight:900;color:#292524;margin:0 0 4px 0;">我們的小白板</h1>
    <p id="pin-hint-text" style="font-size:12px;color:#78716c;margin:0 0 18px 0;">輸入兩人專屬密碼解鎖（預設 0520）</p>

    <!-- 密碼圓點顯示 -->
    <div id="pin-dots" style="display:flex;gap:14px;margin-bottom:20px;">
      <span style="width:14px;height:14px;border-radius:50%;border:2px solid #fda4af;display:inline-block;transition:all 0.15s;"></span>
      <span style="width:14px;height:14px;border-radius:50%;border:2px solid #fda4af;display:inline-block;transition:all 0.15s;"></span>
      <span style="width:14px;height:14px;border-radius:50%;border:2px solid #fda4af;display:inline-block;transition:all 0.15s;"></span>
      <span style="width:14px;height:14px;border-radius:50%;border:2px solid #fda4af;display:inline-block;transition:all 0.15s;"></span>
    </div>

    <!-- 數字鍵盤 -->
    <div class="keypad-grid">
      <button type="button" data-num="1" class="pin-btn">1</button>
      <button type="button" data-num="2" class="pin-btn">2</button>
      <button type="button" data-num="3" class="pin-btn">3</button>
      <button type="button" data-num="4" class="pin-btn">4</button>
      <button type="button" data-num="5" class="pin-btn">5</button>
      <button type="button" data-num="6" class="pin-btn">6</button>
      <button type="button" data-num="7" class="pin-btn">7</button>
      <button type="button" data-num="8" class="pin-btn">8</button>
      <button type="button" data-num="9" class="pin-btn">9</button>
      <div style="height:52px;"></div>
      <button type="button" data-num="0" class="pin-btn">0</button>
      <button type="button" id="pin-backspace" style="background-color:#fff1f2;color:#f43f5e;">⌫</button>
    </div>
    <p id="pin-error" style="font-size:12px;color:#f43f5e;font-weight:600;margin-top:12px;height:16px;"></p>
    <button type="button" id="btn-reset-pin" style="margin-top:8px;font-size:11px;color:#a8a29e;text-decoration:underline;background:none;border:none;cursor:pointer;">
      密碼異常？點此重設為 0520
    </button>
  </div>

  <!-- ==================== 頂部導覽與同步狀態列 ==================== -->
  <header class="sticky top-0 z-30 bg-[#fff9f5]/90 backdrop-blur-md border-b border-rose-100/80 px-4 py-2.5">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <button id="btn-open-settings-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-rose-100 shadow-2xs text-xs font-semibold">
        <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 live-dot"></span>
        <span id="sync-status-text" class="text-stone-700">連線初始化中...</span>
      </button>

      <div class="flex items-center gap-2">
        <button id="btn-switch-role" title="切換目前使用身份" class="px-3 py-1.5 rounded-full bg-rose-50 text-rose-600 text-xs font-bold flex items-center gap-1 active:scale-95 transition">
          <span id="current-role-label">👦 男友</span>
          <i data-lucide="repeat" class="w-3 h-3"></i>
        </button>
        <button id="btn-export-widget" title="匯出高清圖卡" class="p-2 rounded-full bg-white border border-rose-100 text-stone-600 hover:bg-rose-50 transition">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <button id="btn-open-settings" title="雲端同步與密碼設定" class="p-2 rounded-full bg-white border border-rose-100 text-stone-600 hover:bg-rose-50 transition">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 主內容容器 ==================== -->
  <main class="max-w-xl w-full mx-auto px-4 pt-3 flex flex-col gap-4">

    <!-- 1. 高對比「桌面小工具友善看板卡片」 -->
    <section id="widget-dashboard-card" class="bg-white rounded-3xl p-4 shadow-sm border-2 border-rose-100 relative overflow-hidden">
      <div class="flex items-center justify-between border-b border-rose-100/80 pb-3 mb-3">
        <div>
          <span class="text-[11px] font-bold uppercase tracking-wider text-rose-400 block">TOGETHER</span>
          <div class="flex items-baseline gap-1.5">
            <span class="text-sm font-bold text-stone-600">在一起第</span>
            <span id="days-counter" class="text-3xl font-black text-[#ff5e7e] tracking-tight">100</span>
            <span class="text-sm font-bold text-stone-600">天</span>
          </div>
        </div>
        <div class="text-right">
          <span id="last-sync-time" class="text-[11px] text-stone-400 block">準備就緒</span>
          <span id="partner-typing-badge" class="hidden inline-flex items-center gap-1 mt-1 px-2 py-0.5 rounded-full bg-rose-500 text-white text-[11px] font-bold animate-bounce">
            ✏️ 對方正在畫畫...
          </span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5 mb-3">
        <div class="rounded-2xl bg-[#fff5f2] p-2.5 border border-rose-100">
          <div class="flex items-center justify-between mb-1">
            <span id="name-p1" class="text-xs font-bold text-stone-500">👦 男友</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-white text-rose-400 font-semibold">狀態</span>
          </div>
          <div id="status-p1" class="text-base font-extrabold text-stone-800 truncate">想你中 🥰</div>
        </div>
        <div class="rounded-2xl bg-[#f4f8ff] p-2.5 border border-sky-100">
          <div class="flex items-center justify-between mb-1">
            <span id="name-p2" class="text-xs font-bold text-stone-500">👧 女友</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-white text-sky-500 font-semibold">狀態</span>
          </div>
          <div id="status-p2" class="text-base font-extrabold text-stone-800 truncate">上課中 🏫</div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 mb-2.5">
        <button data-status="想你中 🥰" class="status-chip shrink-0 px-2.5 py-1 rounded-xl bg-rose-50 hover:bg-rose-100 text-xs font-bold text-stone-700 transition">想你中 🥰</button>
        <button data-status="上課中 🏫" class="status-chip shrink-0 px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-rose-50 text-xs font-bold text-stone-700 transition">上課中 🏫</button>
        <button data-status="運動中 💪" class="status-chip shrink-0 px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-rose-50 text-xs font-bold text-stone-700 transition">運動中 💪</button>
        <button data-status="開車中 🚗" class="status-chip shrink-0 px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-rose-50 text-xs font-bold text-stone-700 transition">開車中 🚗</button>
        <button data-status="吃飯中 🍱" class="status-chip shrink-0 px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-rose-50 text-xs font-bold text-stone-700 transition">吃飯中 🍱</button>
        <button data-status="睡覺中 💤" class="status-chip shrink-0 px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-rose-50 text-xs font-bold text-stone-700 transition">睡覺中 💤</button>
      </div>

      <div class="rounded-2xl bg-amber-50/90 border border-amber-200/80 px-3 py-2 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-base shrink-0">📌</span>
          <p id="pinned-note-display" class="text-sm font-bold text-stone-800 truncate">今天也要開心喔！記得多喝水 💕</p>
        </div>
        <button id="btn-edit-pinned" class="shrink-0 text-xs font-bold text-amber-700 bg-amber-200/60 hover:bg-amber-200 px-2.5 py-1 rounded-lg transition">修改</button>
      </div>
    </section>

    <!-- 2. 互動塗鴉白板區 -->
    <section class="bg-white rounded-3xl p-3 shadow-sm border-2 border-rose-100 flex flex-col gap-2.5">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-1.5">
          <span class="text-sm font-extrabold text-stone-800">🎨 雙人即時塗鴉板</span>
          <span id="board-save-badge" class="text-[11px] text-emerald-600 font-semibold bg-emerald-50 px-2 py-0.5 rounded-full">已同步</span>
        </div>
        <div class="flex items-center gap-1">
          <button id="btn-board-undo" title="上一步" class="p-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600 disabled:opacity-40 transition">
            <i data-lucide="undo-2" class="w-4 h-4"></i>
          </button>
          <button id="btn-board-clear" title="清空畫布" class="p-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-500 transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
          <button id="btn-sync-now" class="px-2.5 py-1 rounded-xl bg-[#ff6b6b] hover:bg-[#ff525
